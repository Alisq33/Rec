name: Record Web Page

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'رابط الصفحة المراد تسجيلها'
        required: true
        default: 'https://wolf.live/g/9969'
      duration_minutes:
        description: 'مدة التسجيل بالدقائق (مثال: 2 = دقيقتين، 60 = ساعة)'
        required: true
        default: '60'
      screen_width:
        description: 'عرض الشاشة (بكسل)'
        required: false
        default: '1920'
      screen_height:
        description: 'ارتفاع الشاشة (بكسل)'
        required: false
        default: '1080'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes:  ${{ fromJSON(inputs.duration_minutes) + 10 }}  # مهلة إضافية للتحضير والرفع

    steps:
      - name: تثبيت الأدوات المطلوبة
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg chromium-browser

      - name: تشغيل شاشة افتراضية
        run: |
          Xvfb :99 -screen 0 ${{ inputs.screen_width }}x${{ inputs.screen_height }}x24 &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: فتح الصفحة في المتصفح
        run: |
          chromium-browser \
            --kiosk \
            --no-sandbox \
            --disable-infobars \
            --disable-notifications \
            --autoplay-policy=no-user-gesture-required \
            --window-size=${{ inputs.screen_width }},${{ inputs.screen_height }} \
            "${{ inputs.target_url }}" &
          sleep 10   # انتظار تحميل الصفحة

      - name: بدء التسجيل للمدة المحددة
        run: |
          DURATION_SEC=$(( ${{ inputs.duration_minutes }} * 60 ))
          ffmpeg -y \
            -f x11grab \
            -video_size ${{ inputs.screen_width }}x${{ inputs.screen_height }} \
            -framerate 15 \
            -i :99.0 \
            -t $DURATION_SEC \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            recording.mp4

      - name: رفع الفيديو كملف قابل للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: page-recording
          path: recording.mp4
          retention-days: 7
