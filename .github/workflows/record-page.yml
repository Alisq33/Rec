name: Record Web Page with Audio (Full Screen)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'رابط الصفحة المراد تسجيلها'
        required: true
        default: 'https://wolf.live/g/74000'
      duration_minutes:
        description: 'مدة التسجيل بالدقائق'
        required: true
        default: '2'
      screen_width:
        description: 'عرض الشاشة (بكسل)'
        required: false
        default: '1920'
      screen_height:
        description: 'ارتفاع الشاشة (بكسل)'
        required: false
        default: '1080'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: تثبيت الأدوات المطلوبة
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg pulseaudio firefox xdotool x11-xserver-utils

      - name: تشغيل PulseAudio
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_sink
          pactl set-default-sink virtual_sink

      - name: تشغيل شاشة افتراضية بالدقة المطلوبة
        run: |
          Xvfb :99 -screen 0 ${{ inputs.screen_width }}x${{ inputs.screen_height }}x24 &
          sleep 5
          export DISPLAY=:99
          # ضبط الدقة باستخدام xrandr للتأكيد
          xrandr -s ${{ inputs.screen_width }}x${{ inputs.screen_height }}
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: فتح Firefox في وضع ملء الشاشة (kiosk)
        run: |
          firefox --kiosk -url "${{ inputs.target_url }}" &
          echo "⏳ انتظار تحميل الصفحة 20 ثانية..."
          sleep 20

      - name: النقر على زر Unmute (الموقع المحدد)
        run: |
          # حساب الإحداثيات: 49% عرضاً، 18% ارتفاعاً (منتصف المنطقة البرتقالية)
          X_CLICK=$(( ${{ inputs.screen_width }} * 49 / 100 ))
          Y_CLICK=$(( ${{ inputs.screen_height }} * 18 / 100 ))
          echo "🖱️ النقر على ($X_CLICK, $Y_CLICK)"
          sleep 2
          # النقر مرتين
          xdotool mousemove $X_CLICK $Y_CLICK click 1
          sleep 1
          xdotool click 1
          # إرسال مفتاح M كاحتياطي
          xdotool key M

      - name: بدء تسجيل الفيديو والصوت
        run: |
          DURATION_SEC=$(( ${{ inputs.duration_minutes }} * 60 ))
          ffmpeg -y \
            -f x11grab \
            -video_size ${{ inputs.screen_width }}x${{ inputs.screen_height }} \
            -framerate 15 \
            -i :99.0 \
            -f pulse \
            -i default \
            -t $DURATION_SEC \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 128k \
            recording.mp4

      - name: رفع الفيديو الناتج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: page-recording-fullscreen
          path: recording.mp4
          retention-days: 7
