name: Record Web Page with Audio

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'رابط الصفحة المراد تسجيلها'
        required: true
        default: 'https://wolf.live/g/9969'
      duration_minutes:
        description: 'مدة التسجيل بالدقائق'
        required: true
        default: '2'
      screen_width:
        description: 'عرض الشاشة'
        required: false
        default: '1920'
      screen_height:
        description: 'ارتفاع الشاشة'
        required: false
        default: '1080'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: تثبيت الأدوات
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg pulseaudio google-chrome-stable xdotool

      - name: تشغيل PulseAudio وإنشاء مأخذ صوت افتراضي
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_sink
          pactl set-default-sink virtual_sink

      - name: تشغيل شاشة افتراضية
        run: |
          Xvfb :99 -screen 0 ${{ inputs.screen_width }}x${{ inputs.screen_height }}x24 &
          sleep 5
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: فتح المتصفح وإغلاق نافذة الترحيب بضغطة Enter
        run: |
          # تشغيل Chrome في الخلفية
          google-chrome-stable \
            --kiosk \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-software-rasterizer \
            --disable-features=TranslateUI \
            --autoplay-policy=no-user-gesture-required \
            --no-default-browser-check \
            --disable-first-run-ui \
            --user-data-dir=/tmp/chrome-profile \
            --window-size=${{ inputs.screen_width }},${{ inputs.screen_height }} \
            "${{ inputs.target_url }}" &
          
          # انتظار حتى تظهر النافذة (أو أي نافذة Chrome نشطة)
          sleep 3
          
          # إرسال ضغطة Enter إلى النافذة النشطة (التي هي Chrome)
          # هذا سيضغط على زر OK في نافذة الترحيب
          echo "🔄 إرسال ضغطة Enter لإغلاق نافذة الترحيب..."
          xdotool key Return
          sleep 1
          # تأكيد إضافي بإرسال Enter مرة أخرى
          xdotool key Return
          
          # انتظار تحميل الصفحة
          echo "⏳ انتظار تحميل الصفحة 20 ثانية..."
          sleep 20

      - name: بدء التسجيل (فيديو + صوت)
        run: |
          DURATION_SEC=$(( ${{ inputs.duration_minutes }} * 60 ))
          ffmpeg -y \
            -f x11grab \
            -video_size ${{ inputs.screen_width }}x${{ inputs.screen_height }} \
            -framerate 15 \
            -i :99.0 \
            -f pulse \
            -i default \
            -t $DURATION_SEC \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 128k \
            recording.mp4

      - name: رفع الفيديو الناتج
        uses: actions/upload-artifact@v4
        with:
          name: page-recording-with-audio
          path: recording.mp4
          retention-days: 7
