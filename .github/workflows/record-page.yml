name: Record Web Page with Audio (Firefox - Final)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'رابط الصفحة المراد تسجيلها'
        required: true
        default: 'https://wolf.live/g/9969'
      duration_minutes:
        description: 'مدة التسجيل بالدقائق'
        required: true
        default: '2'
      screen_width:
        description: 'عرض الشاشة (بكسل)'
        required: false
        default: '1920'
      screen_height:
        description: 'ارتفاع الشاشة (بكسل)'
        required: false
        default: '1080'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: تثبيت الأدوات
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg pulseaudio firefox xdotool

      - name: تشغيل PulseAudio
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_sink
          pactl set-default-sink virtual_sink

      - name: تشغيل شاشة افتراضية بالدقة المطلوبة
        run: |
          Xvfb :99 -screen 0 ${{ inputs.screen_width }}x${{ inputs.screen_height }}x24 &
          sleep 5
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: فتح Firefox مع ضبط الحجم (بدون نوافذ ترحيب)
        run: |
          firefox --kiosk \
            --width ${{ inputs.screen_width }} \
            --height ${{ inputs.screen_height }} \
            -url "${{ inputs.target_url }}" &
          echo "⏳ انتظار تحميل الصفحة 20 ثانية..."
          sleep 20

      - name: النقر على زر Unmute (الموقع المحدد)
        run: |
          # البحث عن نافذة Firefox
          WINDOW_ID=$(xdotool search --class "firefox" | head -1)
          if [ -z "$WINDOW_ID" ]; then
            echo "⚠️ لم يتم العثور على Firefox، استخدام النافذة النشطة"
            WINDOW_ID=$(xdotool getwindowfocus)
          fi
          echo "✅ معرف النافذة: $WINDOW_ID"
          
          # تفعيل النافذة
          xdotool windowfocus $WINDOW_ID 2>/dev/null || true
          sleep 2
          
          # حساب الإحداثيات: 49% عرضاً، 18% ارتفاعاً
          X_CLICK=$(( ${{ inputs.screen_width }} * 49 / 100 ))
          Y_CLICK=$(( ${{ inputs.screen_height }} * 18 / 100 ))
          echo "🖱️ النقر على الإحداثيات ($X_CLICK, $Y_CLICK)"
          
          # النقر مرتين
          xdotool mousemove --window $WINDOW_ID $X_CLICK $Y_CLICK
          sleep 1
          xdotool click 1
          sleep 1
          xdotool click 1
          
          # إرسال مفتاح M كاحتياطي
          xdotool key M
          echo "✅ تم النقر على زر Unmute"

      - name: بدء تسجيل الفيديو والصوت
        run: |
          DURATION_SEC=$(( ${{ inputs.duration_minutes }} * 60 ))
          ffmpeg -y \
            -f x11grab \
            -video_size ${{ inputs.screen_width }}x${{ inputs.screen_height }} \
            -framerate 15 \
            -i :99.0 \
            -f pulse \
            -i default \
            -t $DURATION_SEC \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 128k \
            recording.mp4

      - name: رفع الفيديو الناتج
        uses: actions/upload-artifact@v4
        with:
          name: page-recording-fullscreen
          path: recording.mp4
          retention-days: 7
