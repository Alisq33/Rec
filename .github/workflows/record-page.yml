name: Record Web Page with Audio (Chrome - Fixed)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'رابط الصفحة المراد تسجيلها'
        required: true
        default: 'https://wolf.live/g/74000'
      duration_minutes:
        description: 'مدة التسجيل بالدقائق'
        required: true
        default: '2'
      screen_width:
        description: 'عرض الشاشة (بكسل)'
        required: false
        default: '1920'
      screen_height:
        description: 'ارتفاع الشاشة (بكسل)'
        required: false
        default: '1080'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: تثبيت الأدوات المطلوبة
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg pulseaudio google-chrome-stable xdotool wmctrl x11-xserver-utils

      - name: تشغيل PulseAudio
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_sink
          pactl set-default-sink virtual_sink

      - name: تشغيل شاشة افتراضية بالدقة المطلوبة
        run: |
          Xvfb :99 -screen 0 ${{ inputs.screen_width }}x${{ inputs.screen_height }}x24 &
          sleep 5
          export DISPLAY=:99
          xrandr -s ${{ inputs.screen_width }}x${{ inputs.screen_height }}
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: إنشاء ملف تفضيلات Chrome
        run: |
          mkdir -p /tmp/chrome-profile
          cat > /tmp/chrome-profile/master_preferences << 'EOF'
          {
            "browser": {
              "check_default_browser": false,
              "has_seen_welcome_page": true
            },
            "distribution": {
              "skip_first_run_ui": true,
              "make_chrome_default_for_user": false
            }
          }
          EOF

      - name: فتح Chrome مع ضبط الحجم
        run: |
          google-chrome-stable \
            --kiosk \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-software-rasterizer \
            --autoplay-policy=no-user-gesture-required \
            --no-default-browser-check \
            --disable-first-run-ui \
            --user-data-dir=/tmp/chrome-profile \
            --initial-preferences-file=/tmp/chrome-profile/master_preferences \
            --window-size=${{ inputs.screen_width }},${{ inputs.screen_height }} \
            "${{ inputs.target_url }}" &
          echo "⏳ انتظار تحميل الصفحة 25 ثانية..."
          sleep 25

      - name: التركيز على نافذة Chrome والنقر على Unmute
        run: |
          # البحث عن نافذة Chrome باستخدام wmctrl (أكثر موثوقية)
          WINDOW_ID=$(wmctrl -l | grep -i "google-chrome" | head -1 | cut -d' ' -f1)
          if [ -z "$WINDOW_ID" ]; then
            echo "⚠️ لم يتم العثور على نافذة Chrome، استخدام النافذة النشطة"
            WINDOW_ID=$(xdotool getwindowfocus)
          fi
          echo "✅ معرف النافذة: $WINDOW_ID"
          
          # تفعيل النافذة باستخدام wmctrl
          wmctrl -i -a $WINDOW_ID
          sleep 2
          
          # حساب الإحداثيات: 49% عرضاً، 18% ارتفاعاً
          X_CLICK=$(( ${{ inputs.screen_width }} * 49 / 100 ))
          Y_CLICK=$(( ${{ inputs.screen_height }} * 18 / 100 ))
          echo "🖱️ النقر على الإحداثيات ($X_CLICK, $Y_CLICK)"
          
          # النقر مرتين مع --sync لضمان التنفيذ
          xdotool mousemove --sync --window $WINDOW_ID $X_CLICK $Y_CLICK
          xdotool click --sync 1
          sleep 1
          xdotool click --sync 1
          
          # إرسال مفتاح M كاحتياطي
          xdotool key --sync M
          echo "✅ تم النقر على زر Unmute"

      - name: بدء تسجيل الفيديو والصوت
        run: |
          DURATION_SEC=$(( ${{ inputs.duration_minutes }} * 60 ))
          ffmpeg -y \
            -f x11grab \
            -video_size ${{ inputs.screen_width }}x${{ inputs.screen_height }} \
            -framerate 15 \
            -i :99.0 \
            -f pulse \
            -i default \
            -t $DURATION_SEC \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 128k \
            recording.mp4

      - name: رفع الفيديو الناتج
        uses: actions/upload-artifact@v4
        with:
          name: page-recording-fullscreen
          path: recording.mp4
          retention-days: 7
