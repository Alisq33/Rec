name: Record Web Page with Audio (Fixed Unmute Position)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'رابط الصفحة المراد تسجيلها'
        required: true
        default: 'https://wolf.live/g/9969'
      duration_minutes:
        description: 'مدة التسجيل بالدقائق'
        required: true
        default: '2'
      screen_width:
        description: 'عرض الشاشة (بكسل)'
        required: false
        default: '1920'
      screen_height:
        description: 'ارتفاع الشاشة (بكسل)'
        required: false
        default: '1080'
      mute_x_percent:
        description: 'النسبة المئوية لعرض الشاشة للنقر (0-100) - اتركها فارغة لاستخدام 48.5%'
        required: false
        default: '48.5'
      mute_y_percent:
        description: 'النسبة المئوية لارتفاع الشاشة للنقر (0-100) - اتركها فارغة لاستخدام 18.5%'
        required: false
        default: '18.5'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: تثبيت الأدوات
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg pulseaudio firefox xdotool

      - name: تشغيل PulseAudio وإنشاء مأخذ صوت افتراضي
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_sink
          pactl set-default-sink virtual_sink

      - name: تشغيل شاشة افتراضية
        run: |
          Xvfb :99 -screen 0 ${{ inputs.screen_width }}x${{ inputs.screen_height }}x24 &
          sleep 5
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: فتح Firefox في وضع kiosk
        run: |
          firefox --kiosk -url "${{ inputs.target_url }}" &
          echo "⏳ انتظار تحميل الصفحة 20 ثانية..."
          sleep 20

      - name: النقر على زر UNMUTE (باستخدام النسب المئوية)
        run: |
          # حساب الإحداثيات بناءً على النسب المئوية المدخلة
          X_PERCENT=${{ inputs.mute_x_percent }}
          Y_PERCENT=${{ inputs.mute_y_percent }}
          
          X_CLICK=$(echo "scale=0; (${{ inputs.screen_width }} * $X_PERCENT) / 100" | bc)
          Y_CLICK=$(echo "scale=0; (${{ inputs.screen_height }} * $Y_PERCENT) / 100" | bc)
          
          echo "🖱️ سيتم النقر على الإحداثيات ($X_CLICK, $Y_CLICK)"
          
          # تحريك المؤشر والنقر مرتين للتأكيد
          xdotool mousemove $X_CLICK $Y_CLICK click 1
          sleep 1
          xdotool click 1
          
          # إرسال مفتاح M كإجراء احتياطي (بعض المشغلات تستجيب له)
          echo "⌨️ إرسال مفتاح M كبديل"
          xdotool key M
          sleep 2

      - name: بدء التسجيل (فيديو + صوت)
        run: |
          DURATION_SEC=$(( ${{ inputs.duration_minutes }} * 60 ))
          ffmpeg -y \
            -f x11grab \
            -video_size ${{ inputs.screen_width }}x${{ inputs.screen_height }} \
            -framerate 15 \
            -i :99.0 \
            -f pulse \
            -i default \
            -t $DURATION_SEC \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 128k \
            recording.mp4

      - name: رفع الفيديو الناتج
        uses: actions/upload-artifact@v4
        with:
          name: page-recording-with-audio
          path: recording.mp4
          retention-days: 7
